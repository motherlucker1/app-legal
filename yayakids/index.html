<h1>芽芽识字乐园 · 帮助与支持</h1>
<p>遇到问题、想提建议，或需要恢复购买帮助，请发邮件到 <a href="mailto:xuxing@xingzhun.org">xuxing@xingzhun.org</a>，我们会在 3 个工作日内回复。</p>
<h2>常见问题</h2>
<p><b>换了手机，购买还在吗？</b><br>在 App 内点「恢复购买」，使用同一个 Apple ID / Google 账号即可恢复。</p>
<p><b>如何取消订阅？</b><br>iPhone：设置 → Apple ID → 订阅；安卓：Google Play → 付款和订阅 → 订阅。</p>
<p><b>我的数据存在哪里？</b><br>所有数据只保存在你的手机上，我们没有服务器。卸载 App 会删除这些数据，请先使用 App 内的备份功能（如有）。</p>
